name: Python tests (GUI - clean)

on:
  pull_request:
    # include both 'main' and 'master' to support repositories using either default
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10, 3.11]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Xvfb, tkinter)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest responses websocket-client

      - name: Run pytest under Xvfb and produce JUnit XML
        run: |
          mkdir -p reports/unit
          xvfb-run -a pytest -q gui/tests --junitxml=reports/unit/junit-unit.xml

      - name: Upload JUnit XML artifact
        uses: actions/upload-artifact@v3
        with:
          name: junit-unit-xml
          path: reports/unit/junit-unit.xml

      - name: Upload entire reports folder
        uses: actions/upload-artifact@v3
        with:
          name: test-reports
          path: reports
