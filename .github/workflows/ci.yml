name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      run_integration:
        description: 'Run integration tests (requires hardware runner)'
        required: false
        default: 'false'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # Ensure editable install of generated OpenAPI client (resolves relative path reliably)
          pip install -e host_client/openapi_client || true
          pip install -r host_client/requirements.txt
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install Spectral (OpenAPI linter)
        run: |
          npm install -g @stoplight/spectral-cli@6
      - name: Validate OpenAPI (docs/openapi.yaml)
        run: |
          spectral lint docs/openapi.yaml --format stylish
      - name: Run pytest
        run: |
          pytest -q

  integration:
    if: ${{ github.event.inputs.run_integration == 'true' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e host_client/openapi_client || true
          pip install -r host_client/requirements.txt
      - name: Run integration tests
        run: |
          pytest -q -m integration
